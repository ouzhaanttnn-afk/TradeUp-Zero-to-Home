workflows:
  tradeup-ios-artifact:
    name: TradeUp 1.2.0 IPA only - NEVER upload to Apple
    instance_type: mac_mini_m2
    max_build_duration: 20
    inputs:
      build_number:
        description: Unused Apple build number above 43
        type: number
    # Existing API integration is used for read-only build-number checks and signing.
    integrations:
      app_store_connect: TradeUp App Store Connect
    environment:
      node: "24"
      xcode: "26.6"
      ios_signing:
        provisioning_profiles:
          - tradeup_game_center_distribution_20261019
        certificates:
          - tradeup_distribution
      vars:
        APP_STORE_APPLE_ID: "6811362281"
        TRADEUP_IOS_BUILD_NUMBER: "${{ inputs.build_number }}"
        VITE_ADMOB_PRODUCTION_ENABLED: "true"
        VITE_ADMOB_TEST_ENABLED: "false"
    scripts:
      - name: Read-only Apple build-number guard
        script: |
          set -euo pipefail
          [[ "$TRADEUP_IOS_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          (( TRADEUP_IOS_BUILD_NUMBER > 43 ))
          latest=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")
          [[ "$latest" =~ ^[0-9]+$ ]]
          (( TRADEUP_IOS_BUILD_NUMBER > latest ))
      - name: Build already-tested source with approved production ad flags
        script: |
          set -euo pipefail
          npm install --global pnpm@11.19.0 --force
          pnpm install --frozen-lockfile
          node scripts/check-native-ad-privacy.mjs
          pnpm build
          node scripts/check-review-ad-config.mjs
          pnpm cap:sync:ios
          node scripts/check-native-ad-privacy.mjs
      - name: Apply existing signing and export IPA without publishing
        script: |
          set -euo pipefail
          xcode-project use-profiles --project "$CM_BUILD_DIR/ios/App/App.xcodeproj"
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            --scheme App \
            --archive-flags="-destination generic/platform=iOS CURRENT_PROJECT_VERSION=$TRADEUP_IOS_BUILD_NUMBER"
          ipa=$(find "$CM_BUILD_DIR/build/ios/ipa" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$ipa"
          archive=$(find "$CM_BUILD_DIR/build/ios/xcarchive" -maxdepth 1 -name '*.xcarchive' -print -quit)
          test -n "$archive"
          signed_app="$archive/Products/Applications/App.app"
          codesign --verify --deep --strict "$signed_app"
          codesign -d --entitlements :- "$signed_app" > "$CM_BUILD_DIR/build/ios/ipa/signed-entitlements.plist"
          python3 scripts/verify-ios-artifact.py "$ipa" --build "$TRADEUP_IOS_BUILD_NUMBER" --version 1.2.0 --ads production --signed-entitlements "$CM_BUILD_DIR/build/ios/ipa/signed-entitlements.plist" > "$CM_BUILD_DIR/build/ios/ipa/verification.json"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/ipa/verification.json
      - build/ios/ipa/signed-entitlements.plist
      - /tmp/xcodebuild_logs/*.log
    # No publishing block: no Apple upload, TestFlight submission, or release.
  tradeup-ios-testflight:
    name: TradeUp 1.2.0 development beta - TestFlight only
    instance_type: mac_mini_m2
    max_build_duration: 45
    # Manual only. Do not auto-build every content commit or spend paid minutes.
    inputs:
      build_number:
        description: Unused Apple build number greater than 41
        type: number
    integrations:
      app_store_connect: TradeUp App Store Connect
    environment:
      node: "24"
      xcode: "26.6"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tradeup.zerotohome
      vars:
        APP_STORE_APPLE_ID: "6811362281"
        TRADEUP_IOS_BUILD_NUMBER: "${{ inputs.build_number }}"
        VITE_ADMOB_PRODUCTION_ENABLED: "true"
        VITE_ADMOB_TEST_ENABLED: "false"
    scripts:
      - name: Reject missing or reused build numbers
        script: |
          set -euo pipefail
          [[ "$TRADEUP_IOS_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          (( TRADEUP_IOS_BUILD_NUMBER > 41 ))
          latest=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")
          [[ "$latest" =~ ^[0-9]+$ ]]
          (( TRADEUP_IOS_BUILD_NUMBER > latest ))
      - name: Verify release source and synchronize native resources
        script: |
          set -euo pipefail
          # Builder images already contain a pnpm shim; pin it in this ephemeral machine.
          npm install --global pnpm@11.19.0 --force
          pnpm install --frozen-lockfile
          node scripts/check-native-ad-privacy.mjs
          pnpm test
          pnpm lint
          pnpm build
          node scripts/check-review-ad-config.mjs
          pnpm cap:sync:ios
          node scripts/check-native-ad-privacy.mjs
      - name: Apply existing signing identities
        script: |
          set -euo pipefail
          xcode-project use-profiles --project "$CM_BUILD_DIR/ios/App/App.xcodeproj"
      - name: Archive and export signed IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            --scheme App \
            --archive-flags="-destination generic/platform=iOS CURRENT_PROJECT_VERSION=$TRADEUP_IOS_BUILD_NUMBER"
          archive=$(find "$CM_BUILD_DIR/build/ios/xcarchive" -maxdepth 1 -name '*.xcarchive' -print -quit)
          test -n "$archive"
          app_plist="$archive/Products/Applications/App.app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_plist")" = '1.2.0'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_plist")" = "$TRADEUP_IOS_BUILD_NUMBER"
          ipa=$(find "$CM_BUILD_DIR/build/ios/ipa" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$ipa"
          python3 scripts/verify-ios-artifact.py "$ipa" --build "$TRADEUP_IOS_BUILD_NUMBER" --version 1.2.0 --ads production > "$CM_BUILD_DIR/build/ios/ipa/verification.json"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/ipa/verification.json
      - /tmp/xcodebuild_logs/*.log
      - build/ios/xcarchive/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
